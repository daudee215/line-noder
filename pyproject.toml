[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "line-noder"
version = "0.2.0"
description = "Detect all interior line-line intersections and build a planar edge-node graph — pure Python, no PostGIS required"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["gis", "topology", "network", "planar-graph", "geospatial", "line-intersection"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
geo = ["shapely>=2.0"]
dev = [
    "pytest>=7.4",
    "pytest-benchmark>=4.0",
    "ruff>=0.4",
    "mypy>=1.8",
    "mkdocs>=1.5",
]

[project.urls]
Homepage = "https://github.com/daudee215/line-noder"
Repository = "https://github.com/daudee215/line-noder"
"Bug Tracker" = "https://github.com/daudee215/line-noder/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/line_noder"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.uv]
system-site-packages = true

[[tool.mypy.overrides]]
module = ["geopandas", "shapely.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["line_noder.shapely_io"]
# optional module: runtime imports geopandas/shapely which have no stubs in this env
ignore_errors = true
